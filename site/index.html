<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Coge Mi Plan · Registro verificado de planes médicos</title>
  <meta name="description" content="Bilingual assistant that tells patients in Puerto Rico which specialists actually accept their health plan today, verified by AI calls." />
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div class="brand">
        <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 12.5l4 4 8-9" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <span class="brand-name" data-t="brandShort">Coge Mi Plan</span>
      </div>
      <nav class="seg" role="tablist">
        <button class="tab on" data-tab="patient" role="tab"><span data-t="tabPatient"></span></button>
        <button class="tab" data-tab="pharmacy" role="tab"><span data-t="tabPharmacy"></span></button>
        <button class="tab" data-tab="verify" role="tab"><span data-t="tabVerify"></span></button>
        <button class="tab" data-tab="impact" role="tab"><span data-t="tabImpact"></span></button>
      </nav>
      <div class="tools">
        <button id="bigtext" class="iconbtn" aria-label="Text size" title="Text size">A<sup>+</sup></button>
        <button id="lang" class="iconbtn" aria-label="Language">EN</button>
        <button id="demo" class="demobtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></svg><span>Demo</span></button>
      </div>
    </div>
  </header>

  <section class="hero">
    <h1 data-t="brand">¿Coge Mi Plan?</h1>
    <p data-t="tagline"></p>
  </section>

  <main>
    <!-- 1. Patient -->
    <section id="view-patient" class="view">
      <div class="iphone-wrap"><div class="iphone" aria-label="iPhone preview">
        <span class="hw hw-action"></span><span class="hw hw-volup"></span><span class="hw hw-voldown"></span><span class="hw hw-power"></span>
        <div class="iphone-frame">
          <div class="screen">
            <div class="statusbar" aria-hidden="true">
              <span class="sb-time">9:41</span>
              <span class="sb-icons">
                <svg viewBox="0 0 18 12" width="18" height="12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
                <svg viewBox="0 0 16 12" width="16" height="12"><path d="M8 11.5 10.4 9a3.4 3.4 0 0 0-4.8 0L8 11.5Zm-4.3-4.4 1.3 1.3a4.3 4.3 0 0 1 6 0l1.3-1.3a6.1 6.1 0 0 0-8.6 0ZM1 4.4l1.3 1.3a8 8 0 0 1 11.4 0L15 4.4a9.9 9.9 0 0 0-14 0Z"/></svg>
                <svg viewBox="0 0 27 13" width="27" height="13"><rect x=".5" y=".5" width="23" height="12" rx="3.8" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2.5"/><path d="M25 4.5v4a2 2 0 0 0 0-4Z" opacity=".45"/></svg>
              </span>
            </div>
            <div class="phone-head">
              <div class="avatar" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 12.5l4 4 8-9" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
              <b data-t="chatTitle"></b>
              <div class="small" data-t="chatSub"></div>
            </div>
            <div id="chat" class="chat"></div>
            <div id="suggest" class="suggest"></div>
            <form id="composer" class="composer">
              <button type="button" id="mic" class="mic" aria-label="Voice note"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
              <input id="msg" autocomplete="off" />
              <button type="submit" class="send" aria-label="Send"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            </form>
            <div class="home-ind" aria-hidden="true"></div>
          </div>
        </div>
        <div class="island" aria-hidden="true"><i></i></div>
      </div></div>

      <div class="side">
        <div class="panel">
          <h3 data-t="behind"></h3>
          <div class="label" data-t="understood"></div>
          <div id="intent" class="chips"></div>
          <div class="label" data-t="funnel"></div>
          <div id="funnel" class="funnel"><p class="muted small">—</p></div>
          <div class="stats">
            <div><span id="stat-calls">0</span><small data-t="statsCalls"></small></div>
            <div><span id="stat-avoided">0</span><small data-t="statsAvoided"></small></div>
          </div>
        </div>
        <div class="panel">
          <h3 data-t="callLog"></h3>
          <div id="calllog" class="calllog"></div>
        </div>
      </div>
    </section>

    <!-- 2. Pharmacy counter -->
    <section id="view-pharmacy" class="view" hidden>
      <div class="panel wide">
        <div>
          <h2 data-t="phTitle"></h2>
          <p class="muted" data-t="phSub"></p>
        </div>
        <div class="phform">
          <label class="sel"><span data-t="phSpec"></span><select id="ph-spec"></select></label>
          <label class="sel"><span data-t="phPlan"></span><select id="ph-plan"></select></label>
          <label class="sel"><span data-t="phTown"></span><select id="ph-town"></select></label>
          <button id="ph-copy" class="cta" data-t="phCopy"></button>
        </div>
        <p id="ph-summary"></p>
        <div id="ph-results"></div>
      </div>
    </section>

    <!-- 3. Verification -->
    <section id="view-verify" class="view" hidden>
      <div class="panel wide">
        <div class="vhead">
          <div>
            <h2 data-t="vTitle"></h2>
            <p class="muted" data-t="vSub"></p>
          </div>
          <button id="v-run" class="cta" data-t="vRun"></button>
        </div>
        <div class="kpis">
          <div><span id="v-compliance">0%</span><small data-t="vCompliance"></small></div>
          <div><span id="v-queue">0</span><small data-t="vQueue"></small></div>
          <div><span id="v-ghost">0</span><small data-t="vGhost"></small></div>
        </div>
        <div id="v-sources"></div>
        <div class="vgrid">
          <table id="vtable">
            <thead><tr><th data-t="colProvider"></th><th data-t="colPlan"></th><th data-t="colLast"></th><th data-t="colDemand"></th><th data-t="colResult"></th></tr></thead>
            <tbody></tbody>
          </table>
          <div id="vlog" class="calllog tall"></div>
        </div>
      </div>
    </section>

    <!-- 3. Impact -->
    <section id="view-impact" class="view" hidden>
      <div class="panel wide">
        <div class="vhead">
          <div>
            <h2><span data-t="iTitle"></span> <span class="synth" data-t="iSynth"></span></h2>
            <p class="muted" data-t="iSub"></p>
          </div>
          <label class="sel"><span data-t="iPlan"></span> <select id="i-plan"></select></label>
        </div>
        <div class="kpis">
          <div><span id="k1">0</span><small data-t="iK1"></small></div>
          <div><span id="k2" class="bad">0</span><small data-t="iK2"></small></div>
          <div><span id="k3" class="bad">0</span><small data-t="iK3"></small></div>
        </div>
        <div class="igrid">
          <table id="heat" class="heat"></table>
          <div>
            <h3 data-t="iGhost"></h3>
            <p class="muted small" data-t="iGhostSub"></p>
            <div id="ghostbars" class="funnel"></div>
            <button id="i-export" class="cta ghost" data-t="iExport"></button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="caption" class="caption" hidden></div>
  <footer><span data-t="disclaimer"></span></footer>
  <script type="module" src="app.js"></script>
</body>
</html>
